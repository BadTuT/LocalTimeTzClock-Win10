; LocalTimeTzClock configuration
; TimeZoneId: any Windows time zone key name.
;   Example: China Standard Time, Tokyo Standard Time,
;            India Standard Time, Nepal Standard Time, UTC
; Enabled: 1 = rewrite the taskbar clock on start, 0 = install hooks but stay off
; Log: 1 = write %LOCALAPPDATA%\tzclock.log (off by default)
TimeZoneId=China Standard Time
Enabled=1
Log=0
